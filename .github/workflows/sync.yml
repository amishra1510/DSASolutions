name: Sync DSA Solutions

on:
  workflow_dispatch:
  schedule:
    - cron: "7,27,47 * * * *"

permissions:
  contents: write

concurrency:
  group: dsa-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config --local user.name "amishra1510"
          git config --local user.email "168969134+amishra1510@users.noreply.github.com"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Sync LeetCode
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
        run: python scripts/sync.py

      - name: Sync CodeChef
        env:
          CODECHEF_USERNAME: ${{ secrets.CODECHEF_USERNAME }}
          CODECHEF_COOKIE: ${{ secrets.CODECHEF_COOKIE }}
        run: python scripts/sync_codechef.py

      - name: Clean CodeChef source files
        run: python scripts/clean_codechef.py

      - name: Sync HackerRank
        env:
          HACKERRANK_USERNAME: ${{ secrets.HACKERRANK_USERNAME }}
          HACKERRANK_COOKIE: ${{ secrets.HACKERRANK_COOKIE }}
        run: python scripts/sync_hackerrank.py

      - name: Update progress dashboard
        run: python scripts/update_dashboard.py

      - name: Commit dashboard
        run: |
          if git diff --quiet README.md; then
            echo "Dashboard is already up to date."
          else
            git add README.md
            git commit -m "docs: update progress dashboard"
            git push
          fi

      - name: Verify repository
        run: git status --short
